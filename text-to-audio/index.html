<!DOCTYPE html>
<html lang="en-AU">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Test | PDF Voice Reader</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f43f5e;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(244, 63, 94, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .file-name {
            flex-grow: 1;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .now-reading {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 25px;
            min-height: 150px;
            position: relative;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-display {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 1.1rem;
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .text-display::-webkit-scrollbar {
            width: 4px;
        }

        .text-display::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .progress-container {
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .settings {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% {
                box-shadow: 0 0 0 0px var(--primary-glow);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
            }

            100% {
                box-shadow: 0 0 0 0px rgba(99, 102, 241, 0);
            }
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loader" class="loading-overlay">
        <span class="loader"></span>
        <p>Analyzing PDF Content...</p>
    </div>

    <div class="container">
        <header>
            <h1>Audio Test</h1>
            <p class="subtitle">PDF-to-Speech</p>
        </header>

        <main class="glass-card">
            <div class="file-info">
                <div class="file-icon">PDF</div>
                <div class="file-name" id="fileName">L1 Capital Quarterly Report</div>
                <div id="pageCount" style="color: var(--text-muted); font-size: 0.85rem">Loading pages...</div>
            </div>

            <div class="controls">
                <button id="playBtn" class="btn btn-primary" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    Play
                </button>
                <button id="pauseBtn" class="btn btn-secondary" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                    Pause
                </button>
                <button id="stopBtn" class="btn btn-secondary" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h12v12H6z" />
                    </svg>
                    Stop
                </button>
            </div>

            <div class="now-reading">
                <div class="status-badge" id="statusBadge">Idle</div>
                <div id="textContent" class="text-display">
                    Welcome. Press play to start reading the document.
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="currentTime">Page 1</span>
                    <span id="totalTime">Total Pages: --</span>
                </div>
            </div>

            <div class="settings">
                <select id="voiceSelect">
                    <option value="">Default Voice</option>
                </select>
                <select id="speedSelect">
                    <option value="0.8">0.8x Speed</option>
                    <option value="1.0" selected>Normal Speed</option>
                    <option value="1.2">1.2x Speed</option>
                    <option value="1.5">1.5x Speed</option>
                </select>
            </div>
        </main>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const PDF_PATH = '2025-12-L1-Capital-Catalyst-Quarterly-Report.pdf';

        let pdfDoc = null;
        let currentUtterance = null;
        let isPaused = false;
        let fullText = [];
        let currentPageIndex = 0;
        const synth = window.speechSynthesis;

        // UI Elements
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const textContent = document.getElementById('textContent');
        const statusBadge = document.getElementById('statusBadge');
        const progressBar = document.getElementById('progressBar');
        const loader = document.getElementById('loader');
        const voiceSelect = document.getElementById('voiceSelect');
        const speedSelect = document.getElementById('speedSelect');
        const pageCountDisplay = document.getElementById('pageCount');
        const currentTimeDisplay = document.getElementById('currentTime');
        const totalTimeDisplay = document.getElementById('totalTime');

        // Initialize voices
        function populateVoices() {
            const voices = synth.getVoices();
            const englishVoices = voices.filter(v => v.lang.includes('en'));

            voiceSelect.innerHTML = englishVoices
                .map(v => `<option value="${v.name}" ${v.default ? 'data-default="true"' : ''}>${v.name} (${v.lang})</option>`)
                .join('');

            // Curated list of most natural sounding voices
            const preferredVoices = [
                'Google US English',
                'Google UK English Female',
                'Google English (Australia)',
                'Microsoft Aria Online',
                'Microsoft Guy Online',
                'Microsoft Natasha Online',
                'Microsoft Clara Online',
                'Samantha',
                'Alex'
            ];

            let selectedVoiceName = '';

            // 1. Try curated list first
            for (const name of preferredVoices) {
                const found = englishVoices.find(v => v.name.includes(name));
                if (found) { selectedVoiceName = found.name; break; }
            }

            // 2. Fallback: Any Google voice
            if (!selectedVoiceName) {
                const googleVoice = englishVoices.find(v => v.name.includes('Google'));
                if (googleVoice) selectedVoiceName = googleVoice.name;
            }

            // 3. Fallback: Any Microsoft Natural/Online voice
            if (!selectedVoiceName) {
                const msNatural = englishVoices.find(v => v.name.includes('Microsoft') && (v.name.includes('Online') || v.name.includes('Neural')));
                if (msNatural) selectedVoiceName = msNatural.name;
            }

            // 4. Fallback: Any Microsoft voice
            if (!selectedVoiceName) {
                const msVoice = englishVoices.find(v => v.name.includes('Microsoft'));
                if (msVoice) selectedVoiceName = msVoice.name;
            }

            // 5. Fallback: System default
            if (!selectedVoiceName) {
                const systemDefault = englishVoices.find(v => v.default);
                if (systemDefault) selectedVoiceName = systemDefault.name;
            }

            // 4. Fallback: First English voice
            if (!selectedVoiceName && englishVoices.length > 0) {
                selectedVoiceName = englishVoices[0].name;
            }

            if (selectedVoiceName) {
                voiceSelect.value = selectedVoiceName;
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();

        // Load PDF
        async function init() {
            try {
                const loadingTask = pdfjsLib.getDocument(PDF_PATH);
                pdfDoc = await loadingTask.promise;

                pageCountDisplay.textContent = `${pdfDoc.numPages} Pages`;
                totalTimeDisplay.textContent = `Total Pages: ${pdfDoc.numPages}`;

                // Extract all text
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText.push(pageText);
                }

                playBtn.disabled = false;
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);

            } catch (err) {
                console.error("Error loading PDF:", err);
                alert("Could not load PDF. Please ensure the file exists and you are viewing via a server.");
            }
        }

        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoice = synth.getVoices().find(v => v.name === voiceSelect.value);
            if (selectedVoice) utterance.voice = selectedVoice;

            utterance.rate = parseFloat(speedSelect.value);

            utterance.onstart = () => {
                statusBadge.textContent = "Reading";
                statusBadge.style.background = "var(--primary)";
                playBtn.classList.add('pulse');
                textContent.textContent = text;
            };

            utterance.onend = () => {
                playBtn.classList.remove('pulse');
                if (!isPaused && currentPageIndex < fullText.length - 1) {
                    currentPageIndex++;
                    updateProgress();
                    speak(fullText[currentPageIndex]);
                } else if (currentPageIndex === fullText.length - 1) {
                    statusBadge.textContent = "Finished";
                    stopBtn.disabled = true;
                    pauseBtn.disabled = true;
                }
            };

            currentUtterance = utterance;
            synth.speak(utterance);
        }

        function updateProgress() {
            const percent = ((currentPageIndex + 1) / fullText.length) * 100;
            progressBar.style.width = `${percent}%`;
            currentTimeDisplay.textContent = `Page ${currentPageIndex + 1}`;
        }

        playBtn.addEventListener('click', () => {
            if (isPaused) {
                synth.resume();
                isPaused = false;
            } else {
                speak(fullText[currentPageIndex]);
            }

            playBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            statusBadge.textContent = "Reading";
        });

        pauseBtn.addEventListener('click', () => {
            synth.pause();
            isPaused = true;
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            statusBadge.textContent = "Paused";
            statusBadge.style.background = "var(--accent)";
        });

        stopBtn.addEventListener('click', () => {
            synth.cancel();
            isPaused = false;
            currentPageIndex = 0;
            updateProgress();
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            statusBadge.textContent = "Stopped";
            textContent.textContent = "Playback stopped. Press play to restart.";
        });

        init();
    </script>
</body>

</html>
