<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faux 3D Image Viewer Demo</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f4f4f4;
      }
      .container {
        max-width: 300px;
        margin: 40px auto;
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .viewer {
        width: 100%;
        height: 400px;
        background: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 8px;
        cursor: ew-resize;
        user-select: none;
        position: relative;
      }
      .viewer img {
        max-width: 100%;
        max-height: 100%;
        display: block;
        margin: 0 auto;
        pointer-events: none;
        transition: opacity 0.1s;
      }
      .instructions {
        margin-top: 16px;
        color: #555;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Faux 3D Product Viewer</h2>
      <div class="viewer" id="viewer">
        <img id="productImage" src="img/1.jpg" alt="3D Product View" />
      </div>
      <div class="instructions">
        Drag left or right on the image to rotate the product.
      </div>
    </div>
    <script>
      // Preload images
      const images = [
        "img/1.jpg",
        "img/2.jpg",
        "img/3.jpg",
        "img/4.jpg",
        "img/5.jpg",
        "img/6.jpg",
        "img/7.jpg",
        "img/8.jpg",
        "img/9.jpg",
      ];
      const preloadedImages = [];
      images.forEach((src) => {
        const img = new Image();
        img.src = src;
        preloadedImages.push(img);
      });
      let currentIndex = 0;
      let isDragging = false;
      let startX = 0;
      let lastIndex = 0;

      const viewer = document.getElementById("viewer");
      const productImage = document.getElementById("productImage");

      function updateImage(index) {
        productImage.src = images[index];
      }

      viewer.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
        lastIndex = currentIndex;
        viewer.style.cursor = "grabbing";
      });
      document.addEventListener("mouseup", () => {
        isDragging = false;
        viewer.style.cursor = "ew-resize";
      });
      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const sensitivity = 20; // pixels per image
        let newIndex = lastIndex + Math.floor(dx / sensitivity);
        newIndex = ((newIndex % images.length) + images.length) % images.length;
        if (newIndex !== currentIndex) {
          currentIndex = newIndex;
          updateImage(currentIndex);
        }
      });
      // Touch support
      viewer.addEventListener("touchstart", (e) => {
        isDragging = true;
        startX = e.touches[0].clientX;
        lastIndex = currentIndex;
      });
      document.addEventListener("touchend", () => {
        isDragging = false;
      });
      document.addEventListener("touchmove", (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        const sensitivity = 20;
        let newIndex = lastIndex + Math.floor(dx / sensitivity);
        newIndex = ((newIndex % images.length) + images.length) % images.length;
        if (newIndex !== currentIndex) {
          currentIndex = newIndex;
          updateImage(currentIndex);
        }
      });
    </script>
  </body>
</html>
