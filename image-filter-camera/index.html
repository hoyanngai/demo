<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <title>Camera Frame Capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100vh;
        width: 100vw;
      }
      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }
      #frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        pointer-events: none;
        z-index: 2;
      }
      #captureBtn {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        padding: 16px 32px;
        font-size: 1.2em;
        border: none;
        border-radius: 8px;
        background: #fff;
        color: #222;
        cursor: pointer;
        opacity: 0.9;
      }
      #downloadLink {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <video id="video" autoplay playsinline style="display: block"></video>
      <canvas id="realtimeCanvas" style="display: none"></canvas>
      <img
        id="frame"
        src="frame.png"
        alt="Frame Overlay"
        style="display: none"
      />
      <video id="video" autoplay playsinline style="display: block"></video>
      <canvas id="realtimeCanvas" style="display: none"></canvas>
      <img
        id="frame"
        src="frame.png"
        alt="Frame Overlay"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          object-fit: cover;
          pointer-events: none;
          z-index: 2;
          display: block;
        "
      />
      <button id="captureBtn">Take Photo</button>
      <a id="downloadLink" download="photo.png"></a>
    </div>
    <canvas id="canvas" style="display: none"></canvas>
    <!-- MediaPipe Selfie Segmentation CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <script>
      const video = document.getElementById("video");
      const frame = document.getElementById("frame");
      const canvas = document.getElementById("canvas"); // for download
      const realtimeCanvas = document.getElementById("realtimeCanvas"); // for live view
      const captureBtn = document.getElementById("captureBtn");
      const downloadLink = document.getElementById("downloadLink");
      // (Segmentation filter temporarily disabled)
      // (Segmentation filter temporarily disabled)

      // Request camera access
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }, // Use front camera for selfies
            audio: false,
          });
          video.srcObject = stream;
        } catch (err) {
          alert("Camera access denied or not available.");
        }
      }

      // Setup MediaPipe Selfie Segmentation
      let selfieSegmentation;
      function setupSegmentation() {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`,
        });
        selfieSegmentation.setOptions({
          modelSelection: 1, // 0=Landscape, 1=General
        });
      }
      setupSegmentation();

      // Helper: run segmentation and get mask via Promise
      function getSegmentationMask(image) {
        return new Promise((resolve) => {
          selfieSegmentation.onResults((results) => {
            resolve(results.segmentationMask);
          });
          selfieSegmentation.send({ image });
        });
      }

      // Adjust canvas size to match viewport size
      function setCanvasSize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      // Capture photo without background removal
      captureBtn.addEventListener("click", async () => {
        if (!video.videoWidth || !video.videoHeight) {
          alert("Camera not ready yet. Please try again in a moment.");
          return;
        }
        setCanvasSize();
        const ctx = canvas.getContext("2d");
        // Draw video frame to canvas (object-fit: cover logic)
        const canvasAspect = canvas.width / canvas.height;
        const videoAspect = video.videoWidth / video.videoHeight;
        let sx, sy, sWidth, sHeight;
        if (videoAspect > canvasAspect) {
          sHeight = video.videoHeight;
          sWidth = sHeight * canvasAspect;
          sx = (video.videoWidth - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = video.videoWidth;
          sHeight = sWidth / canvasAspect;
          sx = 0;
          sy = (video.videoHeight - sHeight) / 2;
        }
        ctx.drawImage(
          video,
          sx,
          sy,
          sWidth,
          sHeight,
          0,
          0,
          canvas.width,
          canvas.height
        );
        // Draw frame overlay as before
        if (frame.naturalWidth && frame.naturalHeight) {
          const frameAspect = frame.naturalWidth / frame.naturalHeight;
          const canvasAspect = canvas.width / canvas.height;
          let sx2, sy2, sWidth2, sHeight2;
          if (frameAspect > canvasAspect) {
            sHeight2 = frame.naturalHeight;
            sWidth2 = sHeight2 * canvasAspect;
            sx2 = (frame.naturalWidth - sWidth2) / 2;
            sy2 = 0;
          } else {
            sWidth2 = frame.naturalWidth;
            sHeight2 = sWidth2 / canvasAspect;
            sx2 = 0;
            sy2 = (frame.naturalHeight - sHeight2) / 2;
          }
          ctx.drawImage(
            frame,
            sx2,
            sy2,
            sWidth2,
            sHeight2,
            0,
            0,
            canvas.width,
            canvas.height
          );
        } else {
          ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
        }
        // Create download link
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.style.display = "block";
          downloadLink.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            downloadLink.style.display = "none";
          }, 100);
        }, "image/png");
      });

      // Start camera only (segmentation filter temporarily disabled)
      window.addEventListener("DOMContentLoaded", async () => {
        await startCamera();
      });
    </script>
  </body>
</html>
